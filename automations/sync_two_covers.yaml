blueprint:
  name: Sync Two Covers
  description: >-
    Keeps two covers (e.g. roller shutters) in sync, bidirectionally.
    When either cover starts opening or closing, the other one mirrors the
    movement, and when the first one stops, the other one is driven to the
    same position (or simply stopped). It does not matter which cover is
    controlled — wall button, Home Assistant UI or a service call — the
    other one always follows. Built-in loop protection, no helper
    entities required.
  domain: automation
  author: Steffen Wagner
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/wagnst/ha-blueprints/blob/main/automations/sync_two_covers.yaml
  input:
    cover_a:
      name: First cover
      description: One of the two covers to keep in sync.
      selector:
        entity:
          filter:
            domain: cover
    cover_b:
      name: Second cover
      description: The other cover to keep in sync.
      selector:
        entity:
          filter:
            domain: cover
    position_sync:
      name: Exact position sync
      description: >-
        When one cover stops, move the other one to the exact same position
        instead of just stopping it. Requires both covers to report and
        accept positions (e.g. calibrated Shelly covers). Disable this if
        your covers are not calibrated — the follower is then stopped as
        soon as the controlled cover stops.
      default: true
      selector:
        boolean: {}

mode: queued
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id:
      - !input cover_a
      - !input cover_b
    to:
      - opening
      - closing
      - open
      - closed

variables:
  cover_a: !input cover_a
  cover_b: !input cover_b
  position_sync: !input position_sync
  source: "{{ trigger.entity_id }}"
  target: "{{ cover_b if source == cover_a else cover_a }}"

conditions:
  # Ignore restarts, reloads and covers dropping off / coming back online.
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none
         and trigger.from_state.state not in ['unavailable', 'unknown']
         and states(target) not in ['unavailable', 'unknown'] }}

actions:
  - choose:
      # Source started opening -> open the target as well. Skipped when the
      # target is already opening (this breaks the feedback loop when the
      # target's movement was caused by this automation) or already fully
      # open.
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'opening'
                 and states(target) != 'opening'
                 and (state_attr(target, 'current_position') is none
                      or state_attr(target, 'current_position') < 100) }}
        sequence:
          - action: cover.open_cover
            target:
              entity_id: "{{ target }}"

      # Source started closing -> close the target as well (same guards as
      # above, mirrored).
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.to_state.state == 'closing'
                 and states(target) != 'closing'
                 and (state_attr(target, 'current_position') is none
                      or state_attr(target, 'current_position') > 0) }}
        sequence:
          - action: cover.close_cover
            target:
              entity_id: "{{ target }}"

      # Source stopped while the target is still moving -> bring the target
      # to the source's position, or stop it if positions are unavailable or
      # position sync is disabled. A target that is not moving is never
      # touched here: nudging a stationary cover is what would start a
      # ping-pong loop between the two.
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.from_state.state in ['opening', 'closing']
                 and trigger.to_state.state in ['open', 'closed']
                 and states(target) in ['opening', 'closing'] }}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ position_sync
                         and state_attr(source, 'current_position') is not none
                         and state_attr(target, 'current_position') is not none }}
                sequence:
                  - action: cover.set_cover_position
                    target:
                      entity_id: "{{ target }}"
                    data:
                      position: "{{ state_attr(source, 'current_position') }}"
            default:
              - action: cover.stop_cover
                target:
                  entity_id: "{{ target }}"
